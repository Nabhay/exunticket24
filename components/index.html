<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@latest/dist/full.css" rel="stylesheet">
</head>
<body class="bg-gray-100">

  <!-- Container for chat interface -->
  <div class="flex h-screen">
    
    <!-- Left Sidebar (Chat Channels) -->
    <div class="w-1/4 bg-white shadow-lg">
      <div class="p-4 bg-blue-600 text-white font-bold">Channels</div>
      <ul class="menu p-4 overflow-y-auto w-full bg-base-100">
        <li><a>General</a></li>
        <li><a>Project A</a></li>
        <li><a>Random</a></li>
        <li><a>Support</a></li>
      </ul>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-grow flex flex-col">
      <div class="p-4 bg-blue-600 text-white font-bold">Chat Window</div>
      <div class="flex-grow p-4 overflow-y-auto bg-white">
        <div class="chat chat-start">
          <div class="chat-bubble">Hello, how can I assist you today?</div>
        </div>
        <div class="chat chat-end">
          <div class="chat-bubble">I need help with my project.</div>
        </div>
      </div>
      <div class="p-4 bg-gray-200">
        <input type="text" placeholder="Type your message" class="input input-bordered w-full" />
      </div>
    </div>

    <!-- Right Sidebar (Previous Chats) -->
    <div class="w-1/4 bg-white shadow-lg">
      <div class="p-4 bg-blue-600 text-white font-bold">Previous Chats</div>
      <ul class="menu p-4 overflow-y-auto w-full bg-base-100">
        <li><a>Chat from Sep 15, 2024</a></li>
        <li><a>Chat from Sep 16, 2024</a></li>
        <li><a>Chat from Sep 17, 2024</a></li>
        <li><a>Chat from Sep 18, 2024</a></li>
      </ul>
    </div>

  </div>

</body>
</html>
